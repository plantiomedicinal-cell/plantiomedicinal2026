server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Habilita compressão Gzip para otimizar o carregamento de assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Regra crucial para SPA (React Router): se o arquivo/pasta não existir, cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets estáticos gerados com hash no nome (JS, CSS, imagens)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Evita cache agressivo no index.html para garantir que o navegador busque novas versões após o deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Páginas de erro personalizadas (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}